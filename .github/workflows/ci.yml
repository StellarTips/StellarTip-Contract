name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo Deny Check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          target: wasm32-unknown-unknown
      - name: Run clippy
        run: cargo clippy --target wasm32-unknown-unknown --release -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      # Workaround: ed25519-dalek 3.x breaks soroban-env-host testutils
      # (rand_core bump reshuffles CryptoRng). Cargo.lock is gitignored so
      # the resolver keeps drifting to the broken 3.x. Pin both ambiguous
      # lockfile entries to 2.2.0 to satisfy soroban-sdk's `^2.1.1` while
      # predating the 3.x trait reshuffle.
      - name: Pin ed25519-dalek to 2.2.0
        run: |
          cargo update -p ed25519-dalek@2.2.0 --precise 2.2.0
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0
      - name: Run tests
        run: cargo test

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-
      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

  # Soroban protocol compatibility matrix (refs issue #84).
  # Validates that the contract uses no host functions introduced in
  # later patch releases, so deployment against the minimum supported
  # protocol does not silently fail in production.
  sdk-matrix:
    name: SDK Compatibility (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "=21.7.0"   # earliest available protocol 21 SDK (21.0.0 was yanked)
          - "=21.7.7"   # current pinned version
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-matrix-${{ matrix.sdk }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-matrix-${{ matrix.sdk }}-
            ${{ runner.os }}-cargo-sdk-matrix-
      - name: Swap SDK version
        # Swaps both [dependencies] and [dev-dependencies] entries so
        # `cargo check` sees a consistent version graph.  Uses a
        # two-step pattern: first replace the simple dependency line,
        # then replace the `version` field inside dev-dependencies.
        # SDk version is routed through an env var to avoid
        # expression-injection (CodeQL actions/code-injection).
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          sed -i "s/^soroban-sdk = \"=21\.7\.7\"/soroban-sdk = \"$SDK_VERSION\"/" Cargo.toml
          sed -i "s/version = \"=21\.7\.7\"/version = \"$SDK_VERSION\"/" Cargo.toml
      - name: Update ethnum (nightly compat)
        # ethnum v1.5.0 (pinned by older soroban-env-guest releases)
        # contains a transmute that newer nightly rustc rejects as
        # E0512.  Upgrading to the latest compatible ethnum (≥ 1.5.3)
        # resolves this without changing any soroban host-function
        # surface — `cargo check` still catches genuine protocol-
        # version regressions.
        run: cargo update -p ethnum
      - name: Cargo Check
        # Uses `check` (not `test`) to validate compilation across SDK
        # versions without invoking testutils, which avoids
        # ed25519-dalek / soroban-env-host compatibility pitfalls.
        run: cargo check --target wasm32-unknown-unknown --release

  doc:
    name: Generate API Documentation (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build rustdoc
        # Mirrors `make doc`. Generates the HTML tree under
        # `target/doc/stellar_tip/index.html`, which is the line-by-line
        # source of truth for `docs/API_REFERENCE.md`. `--no-deps` keeps
        # CI logs (and rustdoc failures) scoped to this crate.
        # `RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links"` promotes any
        # unresolved intra-doc link to a hard error, ensuring all cross-
        # references in rustdoc comments (including TipError variant docs)
        # stay valid as the codebase evolves.
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps
      - name: Upload rustdoc artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-html
          path: target/doc

  scout:
    name: Static Analysis (Scout)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Scout security analysis
        uses: coinfabrik/scout-actions@v3
        with:
          working_directory: "."
          fail_on_error: true
          verbose: false
      - name: Upload Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: report.md

  coverage:
    name: Coverage (≥ 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      # Pin the same ed25519-dalek version used in the test job to avoid
      # soroban-env-host / rand_core incompatibilities.
      - name: Pin ed25519-dalek to 2.2.0
        run: |
          cargo update -p ed25519-dalek@2.2.0 --precise 2.2.0 || true
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0 || true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.14

      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov \
            --lcov \
            --output-path lcov.info

      - name: Enforce ≥ 85% line coverage
        run: |
          cargo llvm-cov report \
            --fail-under-lines 85

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
